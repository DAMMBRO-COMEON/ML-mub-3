<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - MoodMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #F3F4F6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #4F46E5; margin-bottom: 30px; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #E5E7EB; border-radius: 10px; font-family: 'Prompt'; outline: none; }
        input:focus { border-color: #4F46E5; }
        button { background: #4F46E5; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-family: 'Prompt'; font-size: 1rem; }
        button:hover { background: #4338CA; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>MoodMate</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="ตั้งชื่อผู้ใช้งาน" required>
            <input type="password" name="password" placeholder="รหัสผ่าน" required>
            <button type="submit">เข้าสู่ระบบ / สมัครสมาชิก</button>
        </form>
    </div>
</body>
</html>
