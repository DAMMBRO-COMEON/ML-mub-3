<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMate - ประเมินสุขภาพใจ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --primary: #4F46E5; --primary-light: #818CF8; --bg-color: #F3F4F6; --text-dark: #1F2937; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; height: 100vh; }
        .app-container { width: 100%; max-width: 600px; background-color: white; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); overflow-y: auto; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }
        .header h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        .header-links a { color: white; text-decoration: none; font-size: 0.9rem; margin-left: 15px; opacity: 0.9; transition: 0.3s; }
        .header-links a:hover { opacity: 1; text-decoration: underline; }
        
        .content { padding: 40px 20px; text-align: center; }
        .icon-large { font-size: 4rem; color: var(--primary-light); margin-bottom: 20px; }
        .info-text { color: #6B7280; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.6; }
        
        /* ปุ่มประเมิน */
        .btn-assess { background: linear-gradient(135deg, var(--primary), #4338CA); color: white; border: none; padding: 15px 40px; font-size: 1.1rem; font-family: 'Prompt', sans-serif; border-radius: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); font-weight: 500; }
        .btn-assess:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6); }
        .btn-assess:disabled { background: #9CA3AF; cursor: not-allowed; transform: none; box-shadow: none; }

        /* อนิเมชันโหลดดิ้งวงกลมหมุนๆ */
        .loader { display: none; margin: 30px auto; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* การ์ดแสดงผลลัพธ์ */
        .result-card { margin-top: 30px; background: #F9FAFB; border-radius: 15px; padding: 25px; border: 1px solid #E5E7EB; display: none; text-align: left; animation: fadeIn 0.5s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .result-card h3 { margin-top: 0; color: var(--text-dark); border-bottom: 2px solid #E5E7EB; padding-bottom: 10px; font-size: 1.2rem; }
        .risk-level { font-weight: 600; font-size: 1.1rem; margin: 15px 0; }
        
        /* สีของระดับความเสี่ยง */
        .high-risk { color: #EF4444; background: #FEE2E2; padding: 5px 15px; border-radius: 20px; }
        .med-risk { color: #F59E0B; background: #FEF3C7; padding: 5px 15px; border-radius: 20px; }
        .low-risk { color: #10B981; background: #D1FAE5; padding: 5px 15px; border-radius: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fa-solid fa-clipboard-list"></i> ประเมินสุขภาพใจ</h1>
            <div class="header-links">
                <a href="/"><i class="fa-solid fa-leaf"></i> แชท</a>
                <a href="/dashboard"><i class="fa-solid fa-chart-pie"></i> สถิติ</a>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <i class="fa-solid fa-heart-pulse icon-large"></i>
            <h2>เช็คสุขภาพใจของคุณ</h2>
            <p class="info-text">ระบบ AI จะนำประวัติการแชท 10 ข้อความล่าสุดของคุณมาวิเคราะห์เพื่อประเมินความเสี่ยงภาวะซึมเศร้าเบื้องต้นอย่างปลอดภัยและเป็นส่วนตัว</p>
            
            <button class="btn-assess" id="assessBtn" onclick="runAssessment()">
                <i class="fa-solid fa-stethoscope"></i> เริ่มการประเมิน
            </button>
            
            <div class="loader" id="loader"></div>
            
            <!-- ส่วนแสดงผล -->
            <div class="result-card" id="resultCard">
                <h3>ผลการประเมินเบื้องต้น</h3>
                <div class="risk-level" id="riskLevel"></div>
                <p id="recommendation" style="color: #4B5563; line-height: 1.6; margin-bottom: 0;"></p>
            </div>
        </div>
    </div>

    <script>
        async function runAssessment() {
            const btn = document.getElementById('assessBtn');
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            const riskLevel = document.getElementById('riskLevel');
            const recommendation = document.getElementById('recommendation');

            // เปลี่ยนสถานะปุ่มตอนกำลังโหลด
            btn.disabled = true;
            btn.innerHTML = 'กำลังวิเคราะห์ข้อมูล...';
            loader.style.display = 'block';
            resultCard.style.display = 'none';

            try {
                // ส่งคำสั่งประเมินไปที่ backend
                const response = await fetch('/assessment', { method: 'POST' });
                const data = await response.json();
                
                // ปิดโหลดดิ้งและคืนค่าปุ่ม
                loader.style.display = 'none';
                btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> ประเมินใหม่อีกครั้ง';
                btn.disabled = false;
                
                // จัดสีตามระดับความเสี่ยง
                let riskClass = 'low-risk';
                if (data.risk.includes('สูง')) {
                    riskClass = 'high-risk';
                } else if (data.risk.includes('ปานกลาง')) {
                    riskClass = 'med-risk';
                }

                // แสดงผลลัพธ์
                riskLevel.innerHTML = `ระดับความเสี่ยง: <span class="${riskClass}">${data.risk}</span>`;
                recommendation.textContent = data.recommendation;
                resultCard.style.display = 'block';

            } catch (error) {
                loader.style.display = 'none';
                btn.innerHTML = '<i class="fa-solid fa-stethoscope"></i> เริ่มการประเมิน';
                btn.disabled = false;
                alert('เกิดข้อผิดพลาดในการประเมิน กรุณาลองใหม่อีกครั้ง');
            }
        }
    </script>
</body>
</html>
