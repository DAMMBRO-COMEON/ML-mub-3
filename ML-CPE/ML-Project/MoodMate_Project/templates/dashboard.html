<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMate - สถิติอารมณ์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { --primary: #4F46E5; --primary-light: #818CF8; --bg-color: #F3F4F6; --text-dark: #1F2937; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; height: 100vh; }
        .app-container { width: 100%; max-width: 600px; background-color: white; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); overflow-y: auto; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        .header-links a { color: white; text-decoration: none; font-size: 0.9rem; margin-left: 15px; opacity: 0.9; transition: 0.3s; }
        .header-links a:hover { opacity: 1; text-decoration: underline; }
        
        .content { padding: 20px; }
        .chart-card { background: #F9FAFB; border-radius: 15px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); margin-bottom: 20px; border: 1px solid #E5E7EB; }
        .chart-card h2 { font-size: 1.1rem; color: var(--text-dark); margin-top: 0; text-align: center; margin-bottom: 20px;}
        
        .no-data { text-align: center; padding: 50px 20px; color: #6B7280; display: none; }
        .no-data i { font-size: 3rem; color: #D1D5DB; margin-bottom: 15px; }
        
        .app-container::-webkit-scrollbar { width: 6px; }
        .app-container::-webkit-scrollbar-thumb { background-color: #D1D5DB; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fa-solid fa-chart-pie"></i> สถิติอารมณ์</h1>
            <div class="header-links">
                <a href="/"><i class="fa-solid fa-leaf"></i> แชท</a>
                <a href="/assessment"><i class="fa-solid fa-clipboard-list"></i> ประเมิน</a>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- ข้อความแจ้งเตือนเมื่อไม่มีข้อมูล -->
            <div class="no-data" id="noDataMsg">
                <i class="fa-solid fa-folder-open"></i>
                <h3>ยังไม่มีข้อมูลสถิติ</h3>
                <p>ลองไปพิมพ์ระบายความรู้สึกในหน้าแชทดูก่อนนะครับ เมื่อมีข้อมูลแล้วกราฟจะแสดงขึ้นมาเอง</p>
            </div>

            <!-- ส่วนแสดงกราฟ -->
            <div id="chartContainer" style="display: none;">
                <div class="chart-card">
                    <h2>ภาพรวมอารมณ์ของคุณ</h2>
                    <canvas id="emotionChart"></canvas>
                </div>
                
                <div class="chart-card">
                    <h2>คะแนนความรู้สึก (7 วันล่าสุด)</h2>
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/dashboard_data')
            .then(response => response.json())
            .then(data => {
                // เช็คว่ามีข้อมูลในระบบหรือไม่
                const totalEmotions = data.monthly_data.reduce((a, b) => a + b, 0);
                
                if (totalEmotions === 0) {
                    document.getElementById('noDataMsg').style.display = 'block';
                    return;
                }

                // ถ้ามีข้อมูล ให้แสดงผลกราฟ
                document.getElementById('chartContainer').style.display = 'block';

                const ctxEmotion = document.getElementById('emotionChart').getContext('2d');
                new Chart(ctxEmotion, {
                    type: 'doughnut',
                    data: {
                        labels: data.monthly_labels,
                        datasets: [{
                            data: data.monthly_data,
                            backgroundColor: ['#10B981', '#3B82F6', '#9CA3AF', '#F59E0B', '#EF4444'],
                            borderWidth: 0
                        }]
                    },
                    options: { plugins: { legend: { position: 'bottom' } }, cutout: '70%' }
                });

                const ctxScore = document.getElementById('scoreChart').getContext('2d');
                new Chart(ctxScore, {
                    type: 'line',
                    data: {
                        labels: data.daily_labels,
                        datasets: [{
                            label: 'คะแนน (1-10)',
                            data: data.daily_data,
                            borderColor: '#4F46E5',
                            backgroundColor: 'rgba(79, 70, 229, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointBackgroundColor: '#4F46E5'
                        }]
                    },
                    options: { scales: { y: { min: 1, max: 10 } }, plugins: { legend: { display: false } } }
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
