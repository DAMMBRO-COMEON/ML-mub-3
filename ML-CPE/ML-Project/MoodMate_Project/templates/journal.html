<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMate - เพื่อนสนิทของคุณ</title>
    <!-- นำเข้าฟอนต์ Prompt เพื่อให้ดูทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --bg-color: #F3F4F6;
            --chat-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* กล่องแอปพลิเคชันหลัก */
        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--chat-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* แถบเมนูด้านบน */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-links a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            margin-left: 15px;
            opacity: 0.9;
            transition: 0.3s;
        }

        .header-links a:hover { opacity: 1; text-decoration: underline; }

        /* พื้นที่แสดงแชท */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #F9FAFB;
        }

        /* กล่องข้อความทั่วไป */
        .msg {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* ข้อความของผู้ใช้ (ฝั่งขวา) */
        .user-msg {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.2);
        }

        /* ข้อความของ AI (ฝั่งซ้าย) */
        .ai-msg {
            align-self: flex-start;
            background-color: white;
            color: var(--text-dark);
            border-bottom-left-radius: 5px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        /* ป้ายกำกับอารมณ์ */
        .emotion-tag {
            display: block;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 8px;
            text-align: right;
            border-top: 1px dashed #E5E7EB;
            padding-top: 5px;
        }

        /* แอนิเมชันจุดไข่ปลา (Typing Indicator) */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: white;
            padding: 12px 18px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #9CA3AF;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* พื้นที่พิมพ์ข้อความ */
        .input-area {
            padding: 15px 20px;
            background-color: white;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }

        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #E5E7EB;
            border-radius: 25px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.95rem;
            outline: none;
            background-color: #F9FAFB;
            transition: 0.3s;
        }

        .input-area input:focus {
            border-color: var(--primary-light);
            background-color: white;
        }

        .input-area button {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3);
        }

        .input-area button:hover {
            background-color: #4338CA;
            transform: scale(1.05);
        }

        /* ซ่อน Scrollbar เพื่อความสวยงาม */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: #D1D5DB; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fa-solid fa-leaf"></i> MoodMate</h1>
            <div class="header-links">
                <a href="/dashboard"><i class="fa-solid fa-chart-pie"></i> สถิติ</a>
                <a href="/assessment"><i class="fa-solid fa-clipboard-list"></i> ประเมิน</a>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-box" id="chatBox">
            <!-- ดึงประวัติเก่ามาแสดง -->
            {% for entry in entries %}
                <div class="msg user-msg">{{ entry.user_text }}</div>
                <div class="msg ai-msg">
                    {{ entry.ai_reply }}
                    <span class="emotion-tag"><i class="fa-solid fa-tag"></i> แนวโน้มอารมณ์: {{ entry.ml_emotion }}</span>
                </div>
            {% endfor %}
            
            <!-- ไอคอนกำลังพิมพ์ (ซ่อนไว้โดยค่าเริ่มต้น) -->
            <div class="typing-indicator" id="typingIndicator">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="วันนี้รู้สึกอย่างไรบ้าง เล่าให้เราฟังนะ..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Javascript สำหรับจัดการแชทและโหลดดิ้ง -->
    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        // เลื่อนแชทลงล่างสุดอัตโนมัติเมื่อเปิดหน้าเว็บ
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        window.onload = scrollToBottom;

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. นำข้อความผู้ใช้ไปแปะในแชททันที
            appendMessage(text, 'user-msg');
            userInput.value = '';
            
            // 2. แสดงจุดไข่ปลา (AI กำลังพิมพ์...)
            typingIndicator.style.display = 'block';
            chatBox.appendChild(typingIndicator); // ย้ายจุดไข่ปลาไปล่างสุด
            scrollToBottom();

            try {
                // 3. ยิงข้อมูลไปหา Backend
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                
                // 4. ซ่อนจุดไข่ปลา และแสดงข้อความ AI
                typingIndicator.style.display = 'none';
                
                const aiHTML = `
                    ${data.reply}
                    <span class="emotion-tag"><i class="fa-solid fa-tag"></i> แนวโน้มอารมณ์: ${data.emotion}</span>
                `;
                appendMessage(aiHTML, 'ai-msg', true);

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง', 'ai-msg');
            }
        }

        function appendMessage(content, className, isHTML = false) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            if (isHTML) {
                div.innerHTML = content;
            } else {
                div.textContent = content;
            }
            chatBox.insertBefore(div, typingIndicator); // แทรกข้อความก่อนจุดไข่ปลา
            scrollToBottom();
        }
    </script>
</body>
</html>
